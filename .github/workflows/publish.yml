name: Publish image

# Builds the Protek image for amd64 + arm64 and pushes it to GitHub Container
# Registry as ghcr.io/syedhashmi-bit/protek.
#
#   push to main   → :latest and :sha-<short>   (what install.sh and compose pull)
#   tag v1.2.3     → :1.2.3 and :1.2            (pin these for a fixed release)
#
# The image is the same one the CI "docker build" job checks; this job only
# adds the second architecture and the push.

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: true

jobs:
  image:
    name: build + push
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # arm64 is built under emulation. The heavy wheels (numpy, scikit-learn,
      # cryptography) ship aarch64 builds, so pip doesn't compile them.
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/protek
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
          labels: |
            org.opencontainers.image.title=Protek
            org.opencontainers.image.description=CrowdSec to MikroTik bouncer with a NOC dashboard

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=publish
          cache-to: type=gha,scope=publish,mode=max
