<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>PROTEK · LAPI · {{ path }}</title>
<link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ url_for('static', filename='app.css') }}">
<style>
body{margin:0;background:var(--bg-deep);color:var(--text);font-family:'Share Tech Mono',monospace;font-size:13px}
.bar{position:sticky;top:0;background:var(--bg-panel);border-bottom:1px solid var(--border);padding:10px 18px;
  display:flex;gap:14px;align-items:center;font-size:12px}
.bar a{color:var(--cyan);text-decoration:none;letter-spacing:.12em;text-transform:uppercase;font-size:11px}
.bar .url{color:var(--muted);flex:1}
.bar .url b{color:var(--green)}
.bar .meta{color:var(--muted);font-size:11px}
pre{margin:0;padding:18px;white-space:pre-wrap;word-break:break-all;color:var(--green)}
.err{color:var(--red);padding:18px;background:rgba(255,86,115,.06);border-left:3px solid var(--red)}
</style>
</head>
<body>
<div class="bar">
  <a href="{{ url_for('crowdsec_page') }}">← back</a>
  <div class="url"><b>{{ method }}</b> {{ path }}{% if qs %}?{{ qs }}{% endif %}</div>
  <div class="meta">HTTP {{ status }} · {{ duration_ms }}ms · {{ size }} bytes</div>
</div>
{% if error %}
<div class="err">{{ error }}</div>
{% else %}
<pre>{{ body }}</pre>
{% endif %}
</body>
</html>
